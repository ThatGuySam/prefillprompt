name: Update model catalog

on:
    schedule:
        - cron: "17 13 * * 1"
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Enable pnpm
              run: corepack enable

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Refresh public model catalog
              run: pnpm models:update

            - name: Check whether the catalog changed
              id: diff
              run: |
                  if git diff --quiet -- src/data/models.generated.json; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Verify generated catalog
              if: steps.diff.outputs.changed == 'true'
              run: pnpm check

            - name: Open catalog update pull request
              if: steps.diff.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  branch="automation/model-catalog-${GITHUB_RUN_ID}"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git switch -c "$branch"
                  git add src/data/models.generated.json
                  git commit -m "chore: refresh model catalog"
                  git push --set-upstream origin "$branch"
                  gh pr create \
                    --base "${GITHUB_REF_NAME:-main}" \
                    --head "$branch" \
                    --title "chore: refresh model catalog" \
                    --body "Automated weekly refresh from OpenRouter's public model endpoint. The generated catalog passed the full project check."
