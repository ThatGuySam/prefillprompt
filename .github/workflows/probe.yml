name: Probe production URLs

on:
    schedule:
        - cron: "43 14 * * *"
    workflow_dispatch:
        inputs:
            base:
                description: Origin to probe
                default: https://prefillprompt.com

permissions:
    contents: read

jobs:
    probe:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .node-version

            - name: Probe the share-link contract
              env:
                  PROBE_BASE: ${{ inputs.base || 'https://prefillprompt.com' }}
              run: node --max-http-header-size=65536 scripts/probe/run.mjs --providers --base "$PROBE_BASE"
